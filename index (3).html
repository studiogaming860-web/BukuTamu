<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BUKU TAMU SECURITY</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0b1b3a;--mu:#64748b;--ac:#06b6d4;--nv:#0a2147;--bd:#e2e8f0;--in:#f8fafc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050b18;--card:#0b1730;--tx:#e6edf7;--mu:#8aa0bf;--nv:#0a2147;--bd:#1b2d4f;--in:#07112600}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}
.logo svg{width:34px;height:34px;flex:none}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#050b18,#0a2147)}
.box{background:var(--card);border-radius:20px;padding:28px;width:100%;max-width:380px;box-shadow:0 20px 50px #0008;animation:up .4s}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--in)}
input:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
.btn{background:var(--ac);color:#04202b;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.s{background:var(--nv);color:#fff}.btn.g{background:transparent;border:1px solid var(--bd);color:var(--tx)}.btn.r{background:#ef4444;color:#fff}
.btn.sm{padding:5px 9px;font-size:12px}.btn.w{width:100%;margin-top:18px}
#app{display:flex;min-height:100vh}
aside{width:230px;background:var(--nv);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside .logo{margin-bottom:18px;font-size:14px;color:#fff}
.nv{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;color:#b9c8e3;background:0;border:0;text-align:left;cursor:pointer;width:100%}
.nv.on,.nv:hover{background:#ffffff18;color:#fff}.nv.on{box-shadow:inset 3px 0 var(--ac)}
main{flex:1;padding:20px;min-width:0;max-width:1200px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
h2{margin:0;font-size:22px}
.clock{font-size:26px;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;animation:up .35s}
.st b{font-size:30px;display:block}.st span{color:var(--mu);font-size:13px}
.two{display:grid;gap:14px;grid-template-columns:2fr 1fr;margin-top:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
th{text-align:left;color:var(--mu);font-size:11px;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--bd)}td{padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.bd{padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}.in{background:#16a34a22;color:#16a34a}.out{background:#64748b22;color:var(--mu)}
.f{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar>*{flex:1;min-width:130px}
.act{display:flex;gap:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:#0a2147;color:#fff;padding:10px 18px;border-radius:99px;z-index:50;border:1px solid var(--ac)}
#md{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:40}#md .box{max-height:90vh;overflow:auto;max-width:460px}
.act2{display:flex;gap:6px;justify-content:center;margin-top:10px}
@media(max-width:800px){aside{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;justify-content:space-around}
aside .logo,aside .nv span{display:none}.nv{justify-content:center;width:auto;padding:10px 14px;font-size:20px}.nv.on{box-shadow:none}
main{padding:14px 12px 90px}.two{grid-template-columns:1fr}}
@media print{aside,.noprint,#toast{display:none!important}main{padding:0}body{background:#fff;color:#000}.card{border:0}}
</style></head><body>
<div id="boot" style="padding:40px;text-align:center">Memuat…</div>

<section id="login" class="hide"><div class="box">
<div class="logo" style="justify-content:center;font-size:18px;color:var(--tx)"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5z" fill="#0a2147" stroke="#06b6d4" stroke-width="1.6"/><path d="M8.5 12l2.4 2.4L15.5 9.5" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>BUKU TAMU SECURITY</div>
<p id="lt" style="text-align:center;color:var(--mu);margin:6px 0 0">Login petugas keamanan</p>
<form id="lf" onsubmit="return false">
<label>Nama lengkap (hanya setup pertama)</label><input id="ln" class="hide" placeholder="Nama admin">
<label>Username</label><input id="lu" autocomplete="username" maxlength="30">
<label>Password</label><div style="position:relative"><input id="lp" type="password" autocomplete="current-password" maxlength="60"><button type="button" class="btn g sm" style="position:absolute;right:6px;top:6px" onclick="lp.type=lp.type=='password'?'text':'password'">Lihat</button></div>
<button class="btn w" id="lb">Login</button></form>
<div id="le" style="color:#ef4444;font-size:13px;margin-top:10px;text-align:center"></div><div style="color:var(--mu);font-size:11px;text-align:center;margin-top:14px">versi 2 · login diingat</div></div></section>

<div id="app" class="hide">
<aside><div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5z" fill="#0a2147" stroke="#06b6d4" stroke-width="1.6"/><path d="M8.5 12l2.4 2.4L15.5 9.5" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/></svg>BUKU TAMU SECURITY</div>
<button class="nv" data-p="dash">📊<span>Dashboard</span></button>
<button class="nv" data-p="add">➕<span>Tambah Tamu</span></button>
<button class="nv" data-p="data">📋<span>Data Pengunjung</span></button>
<button class="nv" data-p="rep">🧾<span>Laporan</span></button>
<button class="nv admin" data-p="staff">👥<span>Petugas</span></button>
<button class="nv" onclick="logout()" style="margin-top:auto">🚪<span>Logout</span></button></aside>
<main><div class="top"><div><h2 id="ttl"></h2><div style="color:var(--mu);font-size:13px" id="who"></div></div><div style="text-align:right"><div class="clock" id="clk"></div><div style="color:var(--mu);font-size:13px" id="dt"></div></div></div><div id="v"></div></main></div>
<div id="md" class="hide"><div class="box" id="mb"></div></div><div id="toast" class="hide"></div>

<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,staff=[],vis=[],me=null,pg='dash',cur=1,chart,ready=0,F={q:'',d:'',s:'',t:''};
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const hm=t=>t?new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'-';
const dur=(a,b)=>{if(!b)return'-';const m=Math.round((b-a)/6e4);return m<60?m+' mnt':Math.floor(m/60)+' j '+m%60+' mnt'};
async function sha(p,s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hide'),2600)}
function modal(h){$('#mb').innerHTML=h;$('#md').classList.remove('hide')}function closeM(){$('#md').classList.add('hide')}
function ss(k,v){try{v===undefined?localStorage.getItem(k):v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function sg(k){try{return localStorage.getItem(k)}catch(e){return null}}

(async()=>{

 const LS={get(k){try{return JSON.parse(localStorage.getItem('bts_'+k)||'{}')}catch(e){return{}}},put(k,v){localStorage.setItem('bts_'+k,JSON.stringify(v))}},subs={};
 const fire=n=>{const o=LS.get(n);const docs=Object.keys(o).map(id=>({id,data:()=>o[id]}));(subs[n]||[]).forEach(f=>f({docs}))};
 try{localStorage.setItem('bts_t','1');localStorage.removeItem('bts_t');
 db={collection:n=>({onSnapshot(cb){(subs[n]=subs[n]||[]).push(cb);setTimeout(()=>fire(n),0)},
  doc:id=>({async get(){const o=LS.get(n);return{data:()=>o[id]}},async set(d){const o=LS.get(n);o[id]=d;LS.put(n,o);fire(n)},async update(d){const o=LS.get(n);o[id]={...o[id],...d};LS.put(n,o);fire(n)},async delete(){const o=LS.get(n);delete o[id];LS.put(n,o);fire(n)}})})};
 addEventListener('storage',e=>{if(e.key&&e.key.startsWith('bts_'))fire(e.key.slice(4))})}catch(e){}
 if(!db){$('#boot').textContent='Penyimpanan browser diblokir. Buka file ini dengan Chrome biasa (bukan mode Incognito).';return}
 const tm=setTimeout(()=>{if(!ready)$('#boot').textContent='Data belum bisa dijangkau, coba muat ulang…'},10000);
 const sub=(n,cb)=>db.collection(n).onSnapshot(s=>{cb(s.docs.map(d=>({id:d.id,...d.data()})));ready|=n=='staff'?1:2;if(ready==3){clearTimeout(tm);start()}else if(ready&&n!='staff')start()},e=>{$('#boot').textContent='Gagal membaca data: '+(e.message||e.code)});
 sub('staff',r=>{staff=r;if(me){const m=staff.find(x=>x.id==me.id);if(!m||!m.active)logout();else me=m}});
 sub('visitors',r=>{vis=r.sort((a,b)=>b.in-a.in);if(me)render()});
})();

let started=0;
function start(){
 $('#boot').classList.add('hide');
 if(!started){started=1;setupLogin()}
 const sid=sg('sid');if(sid&&!me){const m=staff.find(x=>x.id==sid&&x.active);if(m){me=m;enter()}}
}
function setupLogin(){
 const first=staff.length==0;
 $('#login').classList.remove('hide');
 $('#ln').classList.toggle('hide',!first);
 $('#lt').textContent=first?'Setup pertama: buat akun ADMIN (ganti username/password sesuai keinginan)':'Login petugas keamanan';
 $('#lb').textContent=first?'Buat Admin & Masuk':'Login';
 $('#lb').onclick=doLogin;$('#lf').onkeydown=e=>{if(e.key=='Enter')doLogin()};
}
async function doLogin(){
 const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value,e=$('#le');e.textContent='';
 if(!/^[a-z0-9_.]{3,30}$/.test(u))return e.textContent='Username 3–30 karakter (huruf, angka, _ .)';
 if(p.length<6)return e.textContent='Password minimal 6 karakter';
 if(!staff.length){
  const n=$('#ln').value.trim();if(!n)return e.textContent='Isi nama lengkap';
  const id=uid(),salt=uid(),o={u,name:n,role:'ADMIN',shift:'Pagi',active:true,salt,hash:await sha(p,salt)};
  await db.collection('staff').doc(id).set(o);me={id,...o};return enter()}
 const m=staff.find(x=>x.u==u);
 if(!m||m.hash!=await sha(p,m.salt))return e.textContent='Username atau password salah';
 if(!m.active)return e.textContent='Akun tidak aktif';
 me=m;enter();
}
function enter(){ss('sid',me.id);$('#login').classList.add('hide');$('#app').classList.remove('hide');go('dash')}
function logout(){me=null;ss('sid',null);$('#app').classList.add('hide');$('#lp').value='';setupLogin()}
document.addEventListener('click',e=>{const b=e.target.closest('.nv[data-p]');if(b)go(b.dataset.p)});
function go(p){if(p=='staff'&&me.role!='ADMIN')return;pg=p;cur=1;render()}
setInterval(()=>{const n=new Date();$('#clk').textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());$('#dt').textContent=n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})},1000);

function render(){
 if(!me)return;
 document.querySelectorAll('.nv.admin').forEach(x=>x.classList.toggle('hide',me.role!='ADMIN'));
 document.querySelectorAll('.nv[data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p==pg));
 $('#who').textContent='Petugas: '+me.name+' ('+me.role+', shift '+me.shift+')';
 $('#ttl').textContent={dash:'Dashboard',add:'Tambah Tamu',data:'Data Pengunjung',rep:'Laporan',staff:'Manajemen Petugas'}[pg];
 if(pg=='add'&&$('#af'))return;
 if(pg=='data'&&document.activeElement&&document.activeElement.id=='fq')return rdata(true);
 ({dash:rdash,add:radd,data:rdata,rep:rrep,staff:rstaff})[pg]();
}
const opt=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
const JT=['Tamu','Vendor','Kurir','Karyawan','Kontraktor','Lainnya'],KD=['Motor','Mobil','Truk','Lainnya'];
const badge=r=>r.out?'<span class="bd out">SUDAH KELUAR</span>':'<span class="bd in">MASIH DI DALAM</span>';

function rdash(){
 const t=dkey(Date.now()),td=vis.filter(v=>dkey(v.in)==t),ins=td.filter(v=>!v.out).length;
 $('#v').innerHTML=`<div class="grid">
 <div class="card st"><b>${td.length}</b><span>Total pengunjung hari ini</span></div>
 <div class="card st"><b style="color:#16a34a">${ins}</b><span>Masih di dalam</span></div>
 <div class="card st"><b>${td.length-ins}</b><span>Sudah keluar</span></div>
 <div class="card st"><b>${td.filter(v=>v.plat).length}</b><span>Kendaraan masuk</span></div></div>
 <div class="two"><div class="card"><b>Pengunjung 7 hari terakhir</b><canvas id="ch" height="130"></canvas></div>
 <div class="card"><b>Aktivitas terbaru</b><div style="margin-top:8px">${vis.slice(0,6).map(v=>`<div style="padding:7px 0;border-bottom:1px solid var(--bd)"><b>${esc(v.nama)}</b> ${badge(v)}<br><span style="color:var(--mu);font-size:12px">${esc(v.tujuan)} · ${hm(v.in)}</span></div>`).join('')||'<span style="color:var(--mu)">Belum ada data</span>'}</div></div></div>`;
 const L=[],D=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5),k=dkey(d);L.push(pad(d.getDate())+'/'+pad(d.getMonth()+1));D.push(vis.filter(v=>dkey(v.in)==k).length)}
 if(window.Chart){if(chart)chart.destroy();chart=new Chart($('#ch'),{type:'bar',data:{labels:L,datasets:[{data:D,backgroundColor:'#06b6d4',borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}})}
}

function radd(){
 const n=new Date();
 $('#v').innerHTML=`<div class="card"><form id="af" onsubmit="return false"><div class="f">
 <div><label>Nama lengkap *</label><input name="nama" maxlength="80"></div>
 <div><label>Nomor HP *</label><input name="hp" type="tel" maxlength="20"></div>
 <div><label>Instansi / perusahaan</label><input name="inst" maxlength="80"></div>
 <div><label>Nomor identitas (opsional)</label><input name="idn" maxlength="30"></div>
 <div><label>Jenis pengunjung</label><select name="jenis">${opt(JT)}</select></div>
 <div><label>Nomor kendaraan</label><input name="plat" maxlength="12" style="text-transform:uppercase"></div>
 <div><label>Jenis kendaraan</label><select name="kend">${opt(KD)}</select></div>
 <div><label>Orang yang ditemui *</label><input name="temui" maxlength="80"></div>
 <div><label>Departemen / bagian</label><input name="dept" maxlength="60"></div>
 <div><label>Tujuan kunjungan *</label><input name="tujuan" maxlength="120"></div>
 <div><label>Waktu masuk (otomatis)</label><input value="${n.toLocaleString('id-ID')}" disabled></div></div>
 <button class="btn w" id="sv">Simpan & Check-in</button></form></div>`;
 $('#sv').onclick=async()=>{
  const f=Object.fromEntries(new FormData($('#af')));
  for(const k of['nama','hp','temui','tujuan'])if(!String(f[k]).trim())return toast('Lengkapi kolom bertanda *');
  if(!/^[0-9+\-\s]{6,20}$/.test(f.hp))return toast('Nomor HP tidak valid');
  const o={};for(const k in f)o[k]=String(f[k]).trim();o.plat=o.plat.toUpperCase();
  o.in=Date.now();o.out=null;o.by=me.name;o.byId=me.id;
  $('#sv').disabled=true;
  try{await db.collection('visitors').doc(uid()).set(o);$('#af').reset();toast('Berhasil disimpan. Pengunjung check-in.')}catch(e){toast('Gagal menyimpan')}
  $('#sv').disabled=false};
}

function filt(){return vis.filter(v=>(!F.q||(v.nama+v.hp+v.inst+v.plat+v.tujuan+v.temui).toLowerCase().includes(F.q.toLowerCase()))&&(!F.d||dkey(v.in)==F.d)&&(!F.s||(F.s=='in'?!v.out:!!v.out))&&(!F.t||v.jenis==F.t))}
function rdata(keep){
 const rows=filt(),P=10,tp=Math.max(1,Math.ceil(rows.length/P));if(cur>tp)cur=tp;
 const body=rows.slice((cur-1)*P,cur*P).map((v,i)=>`<tr><td>${(cur-1)*P+i+1}</td><td><b>${esc(v.nama)}</b></td><td>${esc(v.hp)}</td><td>${esc(v.inst)}</td><td>${esc(v.plat)||'-'}</td><td>${esc(v.tujuan)}</td><td>${esc(v.temui)}</td><td>${hm(v.in)}</td><td>${hm(v.out)}</td><td>${dur(v.in,v.out)}</td><td>${badge(v)}</td><td>${esc(v.by)}</td>
 <td class="act"><button class="btn g sm" onclick="det('${v.id}')">Detail</button>${v.out?'':`<button class="btn sm" onclick="co('${v.id}')">Check-out</button>`}${me.role=='ADMIN'?`<button class="btn s sm" onclick="ed('${v.id}')">Edit</button><button class="btn r sm" onclick="del('${v.id}')">Hapus</button>`:''}</td></tr>`).join('');
 const tb=`<div class="tw"><table><tr><th>No</th><th>Nama</th><th>HP</th><th>Instansi</th><th>Kendaraan</th><th>Tujuan</th><th>Ditemui</th><th>Masuk</th><th>Keluar</th><th>Durasi</th><th>Status</th><th>Petugas</th><th>Aksi</th></tr>${body||'<tr><td colspan="13" style="text-align:center;color:var(--mu)">Tidak ada data</td></tr>'}</table></div>
 <div class="act2"><button class="btn g sm" ${cur<=1?'disabled':''} onclick="cur--;rdata()">‹</button><span>${cur} / ${tp} (${rows.length} data)</span><button class="btn g sm" ${cur>=tp?'disabled':''} onclick="cur++;rdata()">›</button></div>`;
 if(keep&&$('#tbx')){$('#tbx').innerHTML=tb;return}
 $('#v').innerHTML=`<div class="card"><div class="bar"><input id="fq" placeholder="Cari nama, HP, instansi…" value="${esc(F.q)}"><input id="fd" type="date" value="${F.d}"><select id="fs"><option value="">Semua status</option><option value="in" ${F.s=='in'?'selected':''}>Masih di dalam</option><option value="out" ${F.s=='out'?'selected':''}>Sudah keluar</option></select><select id="ft"><option value="">Semua jenis</option>${opt(JT,F.t)}</select></div><div id="tbx">${tb}</div></div>`;
 $('#fq').oninput=e=>{F.q=e.target.value;cur=1;rdata(true)};
 $('#fd').onchange=e=>{F.d=e.target.value;cur=1;rdata()};$('#fs').onchange=e=>{F.s=e.target.value;cur=1;rdata()};$('#ft').onchange=e=>{F.t=e.target.value;cur=1;rdata()};
}
async function co(id){const v=vis.find(x=>x.id==id);if(!v||v.out)return toast('Sudah check-out');
 const fresh=await db.collection('visitors').doc(id).get();if(fresh.data()?.out)return toast('Sudah check-out');
 await db.collection('visitors').doc(id).update({out:Date.now(),outBy:me.name});toast('Check-out berhasil')}
function det(id){const v=vis.find(x=>x.id==id);modal(`<h3 style="margin-top:0">${esc(v.nama)}</h3>${badge(v)}<table style="min-width:0;margin-top:10px">${[['HP',v.hp],['Instansi',v.inst],['No. identitas',v.idn],['Jenis',v.jenis],['Kendaraan',(v.plat||'-')+' ('+v.kend+')'],['Ditemui',v.temui+' / '+v.dept],['Tujuan',v.tujuan],['Masuk',hm(v.in)],['Keluar',hm(v.out)],['Durasi',dur(v.in,v.out)],['Petugas',v.by]].map(r=>`<tr><th>${r[0]}</th><td style="white-space:normal">${esc(r[1])||'-'}</td></tr>`).join('')}</table><button class="btn w g" onclick="closeM()">Tutup</button>`)}
function ed(id){const v=vis.find(x=>x.id==id);modal(`<h3 style="margin-top:0">Edit data</h3><form id="ef" onsubmit="return false">${[['nama','Nama'],['hp','HP'],['inst','Instansi'],['plat','No. kendaraan'],['temui','Ditemui'],['tujuan','Tujuan']].map(k=>`<label>${k[1]}</label><input name="${k[0]}" maxlength="120" value="${esc(v[k[0]])}">`).join('')}</form><button class="btn w" id="es">Simpan</button><button class="btn w g" onclick="closeM()">Batal</button>`);
 $('#es').onclick=async()=>{const f=Object.fromEntries(new FormData($('#ef')));if(!f.nama.trim()||!f.tujuan.trim())return toast('Nama & tujuan wajib');for(const k in f)f[k]=f[k].trim();f.plat=f.plat.toUpperCase();await db.collection('visitors').doc(id).update(f);closeM();toast('Data diperbarui')}}
function del(id){if(me.role!='ADMIN')return;const v=vis.find(x=>x.id==id);modal(`<h3 style="margin-top:0">Hapus data?</h3><p>Data <b>${esc(v.nama)}</b> akan dihapus permanen.</p><button class="btn w r" id="dy">Ya, hapus</button><button class="btn w g" onclick="closeM()">Batal</button>`);$('#dy').onclick=async()=>{await db.collection('visitors').doc(id).delete();closeM();toast('Data dihapus')}}

let R={a:dkey(Date.now()),b:dkey(Date.now())};
function rrep(){
 const rows=vis.filter(v=>dkey(v.in)>=R.a&&dkey(v.in)<=R.b).sort((x,y)=>x.in-y.in),done=rows.filter(v=>v.out);
 const avg=done.length?Math.round(done.reduce((s,v)=>s+(v.out-v.in),0)/done.length/6e4):0;
 $('#v').innerHTML=`<div class="card"><div class="bar noprint"><button class="btn g" onclick="rng(0)">Harian</button><button class="btn g" onclick="rng(6)">Mingguan</button><button class="btn g" onclick="rng(29)">Bulanan</button><input type="date" id="ra" value="${R.a}"><input type="date" id="rb" value="${R.b}"></div>
 <h3 style="margin:4px 0">Laporan Buku Tamu Security</h3><div style="color:var(--mu);margin-bottom:10px">Periode ${R.a} s/d ${R.b}</div>
 <div class="grid" style="margin-bottom:12px"><div class="card st"><b>${rows.length}</b><span>Total pengunjung</span></div><div class="card st"><b>${rows.filter(v=>v.plat).length}</b><span>Total kendaraan</span></div><div class="card st"><b>${avg} mnt</b><span>Rata-rata durasi</span></div></div>
 <div class="tw"><table><tr><th>No</th><th>Nama</th><th>Instansi</th><th>Kendaraan</th><th>Tujuan</th><th>Ditemui</th><th>Masuk</th><th>Keluar</th><th>Durasi</th><th>Petugas</th></tr>${rows.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.nama)}</td><td>${esc(v.inst)}</td><td>${esc(v.plat)||'-'}</td><td>${esc(v.tujuan)}</td><td>${esc(v.temui)}</td><td>${hm(v.in)}</td><td>${hm(v.out)}</td><td>${dur(v.in,v.out)}</td><td>${esc(v.by)}</td></tr>`).join('')}</table></div>
 <div class="bar noprint" style="margin-top:14px"><button class="btn" onclick="csv()">Export CSV</button><button class="btn s" onclick="window.print()">Print / Simpan PDF</button></div></div>`;
 $('#ra').onchange=e=>{R.a=e.target.value;rrep()};$('#rb').onchange=e=>{R.b=e.target.value;rrep()};
}
function rng(n){R.b=dkey(Date.now());R.a=dkey(Date.now()-n*864e5);rrep()}
async function csv(){
 const rows=vis.filter(v=>dkey(v.in)>=R.a&&dkey(v.in)<=R.b).sort((x,y)=>x.in-y.in);
 const c=s=>{s=String(s??'');if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};
 const t=[['No','Nama','HP','Instansi','Jenis','Kendaraan','Tujuan','Ditemui','Masuk','Keluar','Durasi','Petugas'].map(c).join(',')].concat(rows.map((v,i)=>[i+1,v.nama,v.hp,v.inst,v.jenis,v.plat,v.tujuan,v.temui,hm(v.in),hm(v.out),dur(v.in,v.out),v.by].map(c).join(','))).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='laporan-'+R.a+'_'+R.b+'.csv';a.click()}

function rstaff(){
 $('#v').innerHTML=`<div class="card"><div class="bar"><button class="btn" onclick="sf()">+ Tambah petugas</button></div><div class="tw"><table style="min-width:600px"><tr><th>Nama</th><th>Username</th><th>Role</th><th>Shift</th><th>Status</th><th>Aksi</th></tr>${staff.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.u)}</td><td>${s.role}</td><td>${esc(s.shift)}</td><td>${s.active?'<span class="bd in">AKTIF</span>':'<span class="bd out">NONAKTIF</span>'}</td><td class="act"><button class="btn s sm" onclick="sf('${s.id}')">Edit</button>${s.id!=me.id?`<button class="btn r sm" onclick="sd('${s.id}')">Hapus</button>`:''}</td></tr>`).join('')}</table></div></div>`}
function sf(id){const s=staff.find(x=>x.id==id)||{u:'',name:'',role:'SECURITY',shift:'Pagi',active:true};
 modal(`<h3 style="margin-top:0">${id?'Edit':'Tambah'} petugas</h3><form id="sfm" onsubmit="return false"><label>Nama lengkap</label><input name="name" maxlength="60" value="${esc(s.name)}"><label>Username</label><input name="u" maxlength="30" value="${esc(s.u)}" ${id?'disabled':''}><label>Password ${id?'(kosongkan jika tidak diganti)':''}</label><input name="p" type="password" maxlength="60"><label>Role</label><select name="role">${opt(['SECURITY','ADMIN'],s.role)}</select><label>Shift</label><select name="shift">${opt(['Pagi','Siang','Malam'],s.shift)}</select><label>Status</label><select name="active"><option value="1">Aktif</option><option value="0" ${s.active?'':'selected'}>Tidak aktif</option></select></form><button class="btn w" id="ss">Simpan</button><button class="btn w g" onclick="closeM()">Batal</button>`);
 $('#ss').onclick=async()=>{const f=Object.fromEntries(new FormData($('#sfm')));const u=(id?s.u:f.u).trim().toLowerCase();
  if(!f.name.trim()||!/^[a-z0-9_.]{3,30}$/.test(u))return toast('Nama/username tidak valid');
  if(!id&&staff.some(x=>x.u==u))return toast('Username sudah dipakai');
  if(!id&&f.p.length<6||f.p&&f.p.length<6)return toast('Password minimal 6 karakter');
  const o={u,name:f.name.trim(),role:f.role,shift:f.shift,active:f.active=='1'};
  if(id&&id==me.id&&(o.role!='ADMIN'||!o.active))return toast('Tidak bisa menurunkan akun sendiri');
  if(f.p){o.salt=uid();o.hash=await sha(f.p,o.salt)}
  if(id)await db.collection('staff').doc(id).update(o);else await db.collection('staff').doc(uid()).set(o);
  closeM();toast('Petugas disimpan')}}
function sd(id){const s=staff.find(x=>x.id==id);modal(`<h3 style="margin-top:0">Hapus petugas?</h3><p><b>${esc(s.name)}</b> akan dihapus.</p><button class="btn w r" id="dy">Ya, hapus</button><button class="btn w g" onclick="closeM()">Batal</button>`);$('#dy').onclick=async()=>{await db.collection('staff').doc(id).delete();closeM();toast('Petugas dihapus')}}
</script></body></html>
